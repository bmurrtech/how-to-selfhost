# Official vLLM image for RTX PRO 6000 metal (not Spark PLE mmap community image).
# Values from .runtime.env via --env-file.

name: ${COMPOSE_PROJECT_NAME:-qwen38-rtx}

services:
  vllm:
    image: ${IMAGE}
    container_name: ${NAME}
    restart: unless-stopped
    gpus: all
    ipc: host
    privileged: true
    shm_size: ${SHM_SIZE:-16g}
    ports:
      - "127.0.0.1:${PORT}:8000"
    volumes:
      - ${HF_CACHE}:/root/.cache/huggingface
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      VLLM_PLE_CPU_OFFLOAD: ${VLLM_PLE_CPU_OFFLOAD:-0}
      VLLM_API_KEY: ${VLLM_API_KEY}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        args=(
          "$${MODEL}"
          --quantization "$${QUANTIZATION:-modelopt}"
          --tensor-parallel-size "$${TENSOR_PARALLEL_SIZE:-1}"
          --max-model-len "$${CTX}"
          --max-num-seqs "$${SEQS}"
          --max-num-batched-tokens "$${MAX_NUM_BATCHED_TOKENS}"
          --gpu-memory-utilization "$${GPU_MEM}"
          --served-model-name "$${SERVED_MODEL_NAME:-qwen3.8-flash-next}"
          --host 0.0.0.0
          --port 8000
          --reasoning-parser qwen3
          --trust-remote-code
        )
        if [[ -n "$${VLLM_API_KEY:-}" ]]; then
          args+=(--api-key "$${VLLM_API_KEY}")
        fi
        if [[ -n "$${EXTRA_ARGS:-}" ]]; then
          # shellcheck disable=SC2206
          extra=( $${EXTRA_ARGS} )
          args+=("$${extra[@]}")
        fi
        if command -v vllm >/dev/null 2>&1; then
          exec vllm serve "$${args[@]}"
        fi
        exec python3 -m vllm.entrypoints.openai.api_server "$${args[@]}"
